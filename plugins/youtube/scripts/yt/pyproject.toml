[project]
name = "yt-toolkit"
version = "0.1.0"
description = "YouTube Producer — toolkit locale per strategia, montaggio, thumbnail e analytics YouTube"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Facoltativo (install.sh --with-mediapipe): MediaPipe Face Landmarker per le classi
# di espressione di yt-portrait scan (blendshape: sorriso di Duchenne, sopracciglia, mascella). Apache-2.0, solo locale.
mediapipe = ["mediapipe==1.1.0"]
